# Default webserv configuration (aligned with subject requirements)
# Relative paths resolve from the working directory where webserv is started

server {
    listen localhost:8080;
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/500.html;
    client_max_body_size 10M;

    location / {
        root www/;
        index index.html;
        limit_except GET POST DELETE;
        autoindex off;
    }

    location /redirect-target {
        return 302 /;
    }

    location /assets {
        root www/;
        autoindex on;
    }

    location /uploads {
        root www/;
        limit_except POST;
        autoindex off;
        upload_store www/uploads;
    }

    location /cgi {
        root www/cgi;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .pl /usr/bin/perl;
    }
}